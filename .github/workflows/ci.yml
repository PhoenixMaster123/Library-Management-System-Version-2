name: CI

# Every service is built and tested on every change, not just the one that changed: they share a
# Kafka topic and an HTTP contract, so a change to one can break another without touching its files.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  java:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The test report is published as a check run, which the read-only default token cannot create.
    permissions:
      contents: read
      checks: write
    strategy:
      # One service failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - name: Library backend
            path: Library-Management-System-Version-2
          - name: Notification-Service
            path: Notification-Service/Notification-Service
          - name: Analytics-Service
            path: Analytics-Service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # The wrappers are committed from Windows, which does not carry the executable bit, so a
      # Linux runner would fail with "Permission denied" before Maven ever starts.
      - name: Make the Maven wrapper executable
        working-directory: ${{ matrix.path }}
        run: chmod +x ./mvnw

      # Checkstyle is bound to `validate`, so it would run inside `verify` anyway - but as its own
      # step a style failure is legible at a glance instead of buried in test output.
      - name: Checkstyle
        working-directory: ${{ matrix.path }}
        run: ./mvnw -B --no-transfer-progress checkstyle:check

      # `verify` runs unit tests (surefire), integration tests (failsafe) and PMD.
      - name: Build and test
        working-directory: ${{ matrix.path }}
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test report
        # Reports are most wanted exactly when the previous step failed.
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ${{ matrix.path }}/target/*-reports/TEST-*.xml
          check_name: Tests - ${{ matrix.name }}
          fail_on_failure: true

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ strategy.job-index }}
          path: |
            ${{ matrix.path }}/target/surefire-reports/
            ${{ matrix.path }}/target/failsafe-reports/
            ${{ matrix.path }}/target/pmd.xml
            ${{ matrix.path }}/target/checkstyle-result.xml
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # No point driving a browser against a backend that failed its own tests.
    needs: [java, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The dev profile seeds from the bundled JSON fixture; the default profile would reach out to
      # Open Library, which makes the suite depend on someone else's uptime.
      - name: Start the backend
        working-directory: Library-Management-System-Version-2
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress -DskipTests \
            -Dcheckstyle.skip=true -Dpmd.skip=true \
            spring-boot:run -Dspring-boot.run.profiles=dev > backend.log 2>&1 &
          echo "started"

      - name: Wait for the backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:9092/login; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not start within 60s"
          tail -50 Library-Management-System-Version-2/backend.log
          exit 1

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            Library-Management-System-Version-2/backend.log
          retention-days: 7
          if-no-files-found: ignore

  # --------------------------------------------------------------------------------------------
  # Publishes the built frontend to GitHub Pages.
  #
  # Pages serves static files and nothing else, so the API has to live somewhere else. Set the
  # repository variable API_BASE_URL to a reachable backend origin and the site will talk to it;
  # leave it unset and the app still loads, but every call fails and the UI says it cannot reach
  # the library. That is the honest outcome for a static host with no server behind it.
  # --------------------------------------------------------------------------------------------
  pages:
    name: Deploy to GitHub Pages
    # Only from the default branch, and only once the code is known to be good.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [java, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/configure-pages@v6

      - name: Install
        working-directory: frontend
        run: npm ci

      # With no backend to call, the app runs its own in the browser rather than publishing a site
      # where nothing works. Set API_BASE_URL and it talks to the real one instead.
      - name: Note whether an API origin is configured
        id: api
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "::notice::No API_BASE_URL, so the site is published in demo mode: the app answers"
            echo "::notice::its own requests in the browser and every screen works, per visitor."
            echo "::notice::Set API_BASE_URL to a backend origin to use the real one instead."
            echo "unconfigured=true" >> "$GITHUB_OUTPUT"
          else
            echo "unconfigured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: frontend
        env:
          # The site is served from https://<owner>.github.io/<repo>/, so assets need that prefix.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_DEMO: ${{ steps.api.outputs.unconfigured }}
        run: npm run build

      - name: Add an SPA fallback
        working-directory: frontend
        # Pages has no rewrite rule, so a deep link like /books is a 404 until the same document is
        # served for it. Copying index.html to 404.html is the usual way to let the router take over.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
