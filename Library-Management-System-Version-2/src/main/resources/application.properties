# Properties for the Library Management System application
spring.application.name=library-ms
server.port=9092

# H2 in-memory database configuration
spring.datasource.url=jdbc:h2:mem:library_ms
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Properties for the H2 console
spring.datasource.username=root
spring.datasource.password=12345

# H2 console. Off by default: it answers without authentication and web-allow-others lets any host
# reach it, which together is a database console open to the internet on anything deployed.
# The dev profile turns it back on - see application-dev.properties.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Caching. Set explicitly to in-memory: spring-boot-starter-data-redis is on the classpath, so
# Boot would otherwise pick Redis and every cached call would fail against a server that is not
# running. Switch to redis only once one is.
spring.cache.type=simple

# Redis configuration
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
management.health.redis.enabled=false

# Loan events published to Analytics-Service over Kafka.
# Note the broker is on 9094, not the usual 9092: this application already serves HTTP there.
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=2000
library.events.topic=library.loans
# Set to false to stop publishing entirely; borrowing works either way.
library.events.enabled=true

# Due-date reminders: a daily sweep for loans falling due in this many days.
library.reminders.days-before=3
library.reminders.cron=0 0 8 * * *

# Stocking an empty catalogue from Open Library on first start. The dev profile uses the local
# JSON fixture in resources/files/json instead and never runs this.
library.catalog.seed.enabled=true
library.catalog.seed.per-subject=40
library.catalog.seed.subjects=fiction,science fiction,fantasy,history,philosophy,poetry,\
  biography,mystery,psychology,mathematics,travel,art

# Notification-Service integration
notification.service.url=http://localhost:9093/api/v1/notifications
# Set to false to stop calling Notification-Service entirely (borrowing still works).
notification.enabled=true
# Keep these short: a slow or dead notification service must not stall a borrow request.
spring.cloud.openfeign.client.config.notification-service.connectTimeout=2000
spring.cloud.openfeign.client.config.notification-service.readTimeout=3000

# Signing key for JWTs. Set this and sessions survive a restart; leave it blank and a fresh key is
# generated per start-up, signing everyone out on every devtools reload. Minimum 32 characters.
# Override by environment anywhere real - a secret in source is a secret anyone can mint tokens with.
library.jwt.secret=${LIBRARY_JWT_SECRET:local-development-only-signing-key-change-me}

# Origins allowed to call this API from a browser. Empty means none, which is right locally where
# the frontend is proxied and already same-origin. A separately hosted frontend - GitHub Pages, say -
# must be named here, comma separated, or the browser blocks every call.
library.cors.allowed-origins=${LIBRARY_CORS_ORIGINS:}

# Analytics-Service integration. Read-only: this application publishes loan events and never owns
# the totals, so the statistics are a projection it borrows back for the Insights page.
analytics.service.url=http://localhost:9095/api/v1/analytics
# Set to false to stop calling Analytics-Service; Insights then reports it as unavailable.
analytics.enabled=true
# Match the notification client: a slow analytics service must not hang an admin page.
spring.cloud.openfeign.client.config.analytics-service.connectTimeout=2000
spring.cloud.openfeign.client.config.analytics-service.readTimeout=3000

# Automatic restart on code change. spring-boot-devtools watches target/classes, so a restart
# only happens once something has recompiled - the IDE has to be building for this to do anything.
# In IntelliJ that is two settings:
#   Settings > Build > Compiler > "Build project automatically"
#   Settings > Advanced Settings > "Allow auto-make to start even if developed application is
#                                   currently running"
# Running from the command line, `./mvnw spring-boot:run` recompiles on its own.
spring.devtools.restart.enabled=true
# Wait for the compiler to finish writing before restarting, so a half-written build is not loaded.
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
# Reloads the browser tab serving the Thymeleaf pages. The React app has its own HMR via Vite.
spring.devtools.livereload.enabled=true

# Logging configuration
logging.level.org.hibernate.persister.entity=ERROR
logging.level.org = WARN
logging.level.blog = WARN
#logging.level.org.hibernate.SQL = DEBUG
logging.level.org.hibernate.type.descriptor = TRACE

# Spring Security configuration
spring.security.user.name={username}
spring.security.user.password={password}

# The bootstrap administrator. Self-registration only ever creates members, so without this
# account the administrator screens have no way in. Override the password by environment in
# anything that is not a local run.
library.admin.username=admin
library.admin.password=${LIBRARY_ADMIN_PASSWORD:admin}

