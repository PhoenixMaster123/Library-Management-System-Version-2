spring.application.name=Analytics-Service
# 9095, not 9094: the Kafka broker this service consumes from holds 9094, and 9092/9093 are the
# library and Notification-Service. Binding HTTP to 9094 meant the service could never both serve
# and reach the broker.
server.port=9095

# In-memory: the statistics are rebuilt from the topic, so nothing here is the source of truth.
spring.datasource.url=jdbc:h2:mem:analytics
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The library publishes here. The broker owns 9094; this service serves HTTP on 9095.
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=springboot.analytics.event.LoanEvent
# Without a broker the container would otherwise log a stack trace every few seconds.
spring.kafka.listener.missing-topics-fatal=false

library.events.topic=library.loans
