# Test overrides. This file shadows src/main/resources/application.properties entirely rather than
# adding to it, so anything the application needs has to be repeated here.

# H2 rather than MySQL: the tests only load the context and exercise the service, and a test that
# needs a database server running is a test that fails on every machine that has not got one -
# including CI.
spring.datasource.url=jdbc:h2:mem:notification_service;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# A mail host has to be present for Boot to auto-configure the JavaMailSender that
# NotificationService takes as a constructor argument; without it the context will not start.
# Nothing is sent: no connection is opened until a send is attempted, and the flag below stops that.
spring.mail.host=localhost
spring.mail.port=2525

# No outbound mail from a test run, whatever the main configuration says.
notification.mail.enabled=false
